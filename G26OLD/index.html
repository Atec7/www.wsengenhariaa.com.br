<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G26</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Remove barras de rolagem da página principal */
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container do iframe para garantir proporções exatas */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Estilização do iframe em tela cheia */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
    }

    .loader-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e9ecef;
      border-top: 4px solid #0d6efd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 16px;
      color: #6c757d;
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="loader" class="loader-screen">
      <div class="spinner"></div>
      <p class="loader-text">Carregando aplicativo...</p>
    </div>

    <iframe 
      id="webAppFrame"
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbwh2Bh7vz7ViKUFaF8Onc0stPDMnyjfWkl8GI-TerYyWRTFHmSl-6m26A_-GFAssxXc/exec" 
      allow="geolocation; microphone; camera; clipboard-write;"
      onload="hideLoader()">
    </iframe>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
