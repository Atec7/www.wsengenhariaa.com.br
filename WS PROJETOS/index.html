<style>
  html, body { margin: 0; height: 100%; background: #14263d; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #eef1f5;
         padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            background: radial-gradient(120% 120% at 100% 0%, #2f33c0 0%, #212284 40%, #0b0c2a 100%); color: #fff;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; transition: opacity .35s; z-index: 2; text-align: center; padding: 24px; }
  #splash.fora { opacity: 0; pointer-events: none; }
  #splash img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(33,212,229,.35); }
  #splash h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  #splash p { margin: 0; color: #b9c0ef; font-size: 14px; }
  .roda { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #21d4e5; animation: gira 0.9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #falha { display: none; }
  #falha a { display: inline-block; margin-top: 6px; background: #21d4e5; color: #0b0c2a; font-weight: 700; text-decoration: none; padding: 11px 18px; border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) { .roda { animation: none; } }
</style>
