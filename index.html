<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja Bem-Vindo à WS Engenharia</title>
    <link rel="icon" href="logo2.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        .splash {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            background:
                radial-gradient(900px 420px at 85% 0%, rgba(217,164,65,.25), transparent 55%),
                radial-gradient(800px 420px at 10% 100%, rgba(33,163,92,.18), transparent 55%),
                linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 60%, var(--navy-800) 100%);
            position: relative;
            overflow: hidden;
        }
        .splash-inner { position: relative; z-index: 2; max-width: 460px; width: 100%; }
        .splash-logo {
            width: 130px; height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(217,164,65,.6);
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
            margin: 0 auto 26px;
            animation: splashPulse 2.2s ease-in-out infinite;
            background: #fff;
            padding: 4px;
        }
        @keyframes splashPulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .splash h1 { color: #fff; font-size: 30px; margin-bottom: 10px; }
        .splash h1 .hl { color: var(--gold); }
        .splash p.tag { color: rgba(255,255,255,.8); font-size: 16px; margin-bottom: 28px; }
        .loader-bar {
            width: 220px; height: 5px;
            background: rgba(255,255,255,.15);
            border-radius: 999px;
            margin: 0 auto 26px;
            overflow: hidden;
            position: relative;
        }
        .loader-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 40%;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            border-radius: 999px;
            animation: load 1.1s ease-in-out infinite;
        }
        @keyframes load { 0% { left: -40%; } 100% { left: 100%; } }
        .splash .enter { color: rgba(255,255,255,.65); font-size: 13px; margin-bottom: 22px; }
        .btn-enter { display: inline-block; }
    </style>
</head>
<body>
    <section class="splash">
        <div class="splash-inner">
            <img class="splash-logo" src="logo2.png" alt="Logo WS Engenharia">
            <h1>Seja Bem-Vindo</h1>
            <p class="tag">WS ENGENHARIA, <span class="hl">Consultoria</span> &amp; Treinamentos</p>
            <div class="loader-bar"></div>
            <div class="enter">Redirecionando para o nosso site...</div>
            <a href="inicio.html" class="btn btn-gold btn-enter">Entrar no site →</a>
        </div>
    </section>

    <script>
        setTimeout(function () {
            window.location.href = 'inicio.html';
        }, 3500);
    </script>
</body>
</html>
